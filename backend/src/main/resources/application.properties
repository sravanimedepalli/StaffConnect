# ===================================================================
# StaffConnect - Enterprise Workforce Management Application Config
# ===================================================================

server.port=${PORT:${SERVER_PORT:8080}}
spring.application.name=staffconnect-backend

# Active profile: 'dev' (H2 in MySQL compatibility mode for instant execution)
# To connect to your local MySQL instance, switch to: 'mysql'
spring.profiles.active=dev

# JWT Configuration (HMAC-SHA256, 24 Hours validity)
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=86400000

# Gmail SMTP Configuration (Configurable via Environment Variables)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:${MAIL_USERNAME:}}
spring.mail.password=${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Set to true to send actual emails via Gmail SMTP, false for simulated mode
mail.enabled=${MAIL_ENABLED:false}

# Application Frontend Base URL
app.frontend.url=${FRONTEND_URL:http://localhost:8080}

# Real Phone OTP / SMS Gateway Configuration
# Supported providers: 'mock', 'twilio', 'msg91'
sms.provider=${SMS_PROVIDER:mock}

# Twilio SMS Gateway Settings
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.from-number=${TWILIO_PHONE_NUMBER:}

# MSG91 SMS Gateway Settings
msg91.auth-key=${MSG91_AUTH_KEY:}
msg91.template-id=${MSG91_TEMPLATE_ID:}

# File Upload Configuration
app.upload.dir=uploads/avatars
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# JSON Formatting
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Kolkata
